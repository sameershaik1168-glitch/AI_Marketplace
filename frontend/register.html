<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your account | AI CreatorHub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="auth"><div id="site-header"></div><main class="auth-layout"><aside class="auth-art"><div class="auth-art-image"></div><p class="eyebrow">GOOD IDEAS DON'T MAKE THEMSELVES</p><h2>Find your<br>creative people.</h2><p>A marketplace for the curious, the makers, and what's next.</p></aside><section class="auth-main"><form id="register-form" class="auth-form"><p class="eyebrow">MAKE ROOM FOR WHAT'S NEXT</p><h1>Join the mix.</h1><p class="auth-lede">One account. A whole new creative orbit.</p><div class="form-message" role="status"></div><label class="field">I'm here as<select name="role" id="account-role" required><option value="brand">A brand or business</option><option value="creator">An AI creator</option></select></label><label class="field">Your name<input name="name" required maxlength="80" autocomplete="name" placeholder="Jordan Lee"></label><label class="field company-field">Company name <span class="field-hint">Optional</span><input name="company" maxlength="100" autocomplete="organization" placeholder="Studio or business"></label><label class="field">Email address<input name="email" type="email" required autocomplete="email" placeholder="you@company.com"></label><label class="field">Password<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><button class="button button-dark button-wide" type="submit">Create account <span>↗</span></button><p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p></form></section></main><div id="site-footer"></div><script src="js/app.js" defer></script><script src="js/auth.js" defer></script></body></html>
