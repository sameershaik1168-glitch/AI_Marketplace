<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover creators | AI CreatorHub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="creators"><div id="site-header"></div><main class="wrap page-shell"><header class="page-heading"><div><p class="eyebrow">THE CREATOR DIRECTORY</p><h1>Find your kind<br>of creative.</h1><p>Independent makers. Original perspectives. A little AI magic.</p></div><a class="button button-dark" href="create-brief.html">Post a brief <span>↗</span></a></header>
<section class="filters" aria-label="Filter creators"><label class="search-field"><span aria-hidden="true">⌕</span><input id="creator-search" type="search" placeholder="Search creators, skills, styles..."></label><select id="category-filter" aria-label="Category"><option value="">All categories</option><option>AI Video</option><option>AI Images</option><option>AI Copywriting</option><option>AI Animation</option><option>AI Social Media</option><option>AI Branding</option></select><select id="tool-filter" aria-label="AI tool"><option value="">Any AI tool</option><option>Midjourney</option><option>Runway</option><option>Adobe Firefly</option><option>ChatGPT</option><option>ElevenLabs</option><option>Stable Diffusion</option></select><select id="price-filter" aria-label="Maximum starting price"><option value="">Any price</option><option value="250">Under $250</option><option value="500">Under $500</option><option value="1000">Under $1,000</option></select><select id="rating-filter" aria-label="Minimum rating"><option value="">Any rating</option><option value="4.5">4.5+ stars</option><option value="4">4+ stars</option></select></section>
<div class="results-meta"><span id="creator-count">Featured creators</span><button class="clear-filters" id="clear-filters" type="button">Clear filters</button></div><section id="creator-grid" class="creator-grid" aria-live="polite"></section></main><div id="site-footer"></div><script src="js/app.js" defer></script><script src="js/creators.js" defer></script></body></html>
