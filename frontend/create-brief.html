<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a brief | AI CreatorHub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="brief"><div id="site-header"></div><main class="wrap page-shell narrow-shell"><header class="page-heading compact-heading"><div><p class="eyebrow">START WITH THE IDEA</p><h1>Make a brief<br>worth making.</h1><p>Give creators the context to do their best work.</p></div><span class="step-chip">01 / 02 &nbsp; YOUR PROJECT</span></header><form id="brief-form" class="form-panel"><div class="form-grid"><label class="field field-full">Project title<input name="title" required maxlength="120" placeholder="e.g. Spring launch for our new collection"></label><label class="field">Creative category<select name="category" required><option value="">Choose a category</option><option>AI Video</option><option>AI Images</option><option>AI Copywriting</option><option>AI Animation</option><option>AI Social Media</option><option>AI Branding</option></select></label><label class="field">Primary platform<select name="platform"><option>Instagram</option><option>TikTok</option><option>YouTube</option><option>Website</option><option>LinkedIn</option><option>Multi-channel</option></select></label><label class="field field-full">What are you looking to create?<textarea name="description" required maxlength="3000" rows="5" placeholder="Share the story, audience, and what a great result looks like..."></textarea></label><label class="field field-full">Deliverables <span class="field-hint">Separate each item with a comma</span><input name="deliverables" placeholder="3 short-form videos, 5 story frames, source files"></label><label class="field">Budget (USD)<input name="budget" type="number" min="0" placeholder="1,500"></label><label class="field">Ideal delivery date<input name="deadline" type="date"></label></div><div class="form-actions"><p>Your brief will be visible to creators on the marketplace.</p><button class="button button-dark" type="submit">Publish brief <span>↗</span></button></div></form></main><div id="site-footer"></div><script src="js/app.js" defer></script><script src="js/projects.js" defer></script></body></html>
